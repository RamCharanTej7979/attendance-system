{% extends 'layout.html' %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="glass-panel" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <i class="ri-admin-fill" style="font-size: 3rem; color: var(--primary);"></i>
            <h2 class="mt-2">Admin Login</h2>
        </div>

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="admin">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required
                    placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">Login to Dashboard</button>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="text-muted" style="text-decoration: none;"><i
                    class="ri-arrow-left-line"></i> Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="dashboard-header mt-6">
    <h2>Add New Student</h2>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">&larr; Back to Dashboard</a>
</div>

<div class="container" style="display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center;">
    <!-- Form Side -->
    <div class="center-card" style="margin: 0; min-width: 350px;">
        <h3 style="margin-bottom: 1.5rem;">Student Details</h3>
        
        <form id="add-student-form">
            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" name="name" class="form-control" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="roll_no">Roll Number</label>
                <input type="text" id="roll_no" name="roll_no" class="form-control" required autocomplete="off">
            </div>
            
            <div id="status-message" class="flash" style="display: none; margin-top: 1rem;"></div>
            
            <button type="button" id="capture-btn" class="btn btn-primary btn-block mt-4">
                📸 Capture & Save
            </button>
        </form>
    </div>

    <!-- Camera Side -->
    <div class="center-card" style="margin: 0; flex-grow: 1; min-width: 350px; text-align: center;">
        <h3 style="margin-bottom: 1.5rem;">Live Camera Feed</h3>
        <p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem;">
            Ensure the student is facing the camera directly.
        </p>
        <div class="video-container">
            <img src="{{ url_for('raw_video_feed') }}" alt="Camera Feed">
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('capture-btn').addEventListener('click', function() {
    const name = document.getElementById('name').value;
    const roll_no = document.getElementById('roll_no').value;
    const statusDiv = document.getElementById('status-message');
    
    if(!name || !roll_no) {
        statusDiv.className = 'flash error';
        statusDiv.style.display = 'block';
        statusDiv.textContent = 'Please fill out all fields.';
        return;
    }
    
    // Disable button to prevent multi-clicks
    this.disabled = true;
    this.textContent = 'Processing...';
    
    // Prepare data
    const formData = new FormData();
    formData.append('name', name);
    formData.append('roll_no', roll_no);
    
    // Send AJAX
    fetch('{{ url_for("capture_and_add_student") }}', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        statusDiv.style.display = 'block';
        if(data.success) {
            statusDiv.className = 'flash success';
            statusDiv.textContent = data.message;
            document.getElementById('add-student-form').reset();
        } else {
            statusDiv.className = 'flash error';
            statusDiv.textContent = data.message;
        }
    })
    .catch(error => {
        statusDiv.style.display = 'block';
        statusDiv.className = 'flash error';
        statusDiv.textContent = 'An error occurred during submission.';
    })
    .finally(() => {
        this.disabled = false;
        this.textContent = '📸 Capture & Save';
    });
});
</script>
{% endblock %}

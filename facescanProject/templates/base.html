<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Face Attendance System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/">Face Attendance</a>
        </div>
        <ul class="navbar-links">
            <li><a href="/admin">Admin</a></li>
            <li><a href="/student">Student</a></li>
            <li><a href="/attendance">Live Attendance</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}
        <!-- Default content if none is provided -->
        <h1>Welcome to Face Recognition Attendance System</h1>
        <p>Please select an option from the navigation menu.</p>
        {% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
